# Nginx — Marina AI Agent
# Copie para: /etc/nginx/sites-available/marina
# Ative com: ln -s /etc/nginx/sites-available/marina /etc/nginx/sites-enabled/marina
#
# SSL é gerenciado pelo certbot (Let's Encrypt)
# Execute: certbot --nginx -d seu-dominio.com -d www.seu-dominio.com

# Redireciona HTTP → HTTPS
server {
    listen 80;
    server_name seu-dominio.com www.seu-dominio.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name seu-dominio.com www.seu-dominio.com;

    # Certificados SSL (gerenciados pelo certbot)
    ssl_certificate     /etc/letsencrypt/live/seu-dominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/seu-dominio.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Headers de segurança
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-XSS-Protection "1; mode=block";

    # Gzip
    gzip on;
    gzip_types text/plain application/json;

    # Marina API
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 10M;
    }

    # Evolution API (WhatsApp) — acessível apenas internamente
    # Descomente se quiser expor o painel da Evolution API externamente
    # location /evolution/ {
    #     proxy_pass         http://127.0.0.1:8080/;
    #     proxy_set_header   Host $host;
    #     proxy_set_header   X-Real-IP $remote_addr;
    # }

    access_log /var/log/nginx/marina_access.log;
    error_log  /var/log/nginx/marina_error.log;
}
