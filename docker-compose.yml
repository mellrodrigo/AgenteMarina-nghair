version: '3.8'

services:
  evolution-api:
    image: atendai/evolution-api:v1.8.2
    container_name: evolution-api
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - SERVER_URL=http://localhost:8080
      # Autenticação
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY:-1d0a8328a3cab91dea8f1276cbb95172}
      - AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES=true
      # Banco de dados (SQLite — suportado no v1.x)
      - DATABASE_ENABLED=true
      - DATABASE_CONNECTION_URI=file:./evolution.db?mode=memory&cache=shared&_fk=1
      - DATABASE_CONNECTION_CLIENT_NAME=evolution_exchange
      # Persistência local
      - STORE_MESSAGES=true
      - STORE_MESSAGE_UP=true
      - STORE_CONTACTS=true
      - STORE_CHATS=true
      - STORE_CLEANING_INTERVAL=7200
      # Webhook global
      - WEBHOOK_GLOBAL_URL=${API_WEBHOOK_URL:-https://marina.nghair.com.br/webhook/whatsapp}
      - WEBHOOK_GLOBAL_ENABLED=true
      - WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS=false
      - WEBHOOK_EVENTS_MESSAGES_UPSERT=true
      - WEBHOOK_EVENTS_CONNECTION_UPDATE=true
      # QR Code
      - QRCODE_LIMIT=30
      - QRCODE_COLOR=#25D366
    volumes:
      - evolution-data:/evolution/instances
      - evolution-store:/evolution/store
    networks:
      - marina-network
    restart: unless-stopped

volumes:
  evolution-data:
  evolution-store:

networks:
  marina-network:
    driver: bridge
