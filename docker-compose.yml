  #     - POSTGRES_DB=marina
  #     - POSTGRES_USER=marina
  #     - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-trocar_senha}
  #   ports:
  #     - "127.0.0.1:5432:5432"
  #   volumes:
  #     - postgres-data:/var/lib/postgresql/data
  #   networks:
  #     - marina-network
  #   restart: always

volumes:
  evolution-data:
