version: '3.8'

services:
  evolution-api:
    image: atendai/evolution-api:latest
    container_name: evolution-api
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - DB_CONNECTION=sqlite
      - DB_SAVE_DATA_INSTANCE=true
      - DB_SAVE_DATA_NEW_MESSAGE=true
      - DB_SAVE_DATA_NEW_MESSAGE_UPDATE=true
      - DB_SAVE_DATA_NEW_DIFFUTIL_CONTACTS=true
      - DB_SAVE_DATA_NEW_DIFFUTIL_CHATS=true
      - DB_SAVE_DATA_NEW_DIFFUTIL_MESSAGES=true
      # Altere para o domínio real antes do deploy
      - WEBHOOK_GLOBAL_URL=${API_WEBHOOK_URL:-https://seu-dominio.com/webhook/whatsapp}
      - WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS=true
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY:-}
    volumes:
      - evolution-data:/home/evolution/instances
    networks:
      - marina-network
    restart: always

  # PostgreSQL — ative comentando as linhas abaixo quando quiser migrar do SQLite
  # postgres:
