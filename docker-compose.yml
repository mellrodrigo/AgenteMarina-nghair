version: '3.8'

services:
  evolution-mongodb:
    image: mongo:6
    container_name: evolution-mongodb
    environment:
      - MONGO_INITDB_ROOT_USERNAME=evolution
      - MONGO_INITDB_ROOT_PASSWORD=evolution123
      - MONGO_INITDB_DATABASE=evolution
    volumes:
      - evolution-mongodb-data:/data/db
    networks:
      - marina-network
    restart: unless-stopped

  evolution-api:
    image: atendai/evolution-api:v1.8.2
    container_name: evolution-api
    ports:
      - "8080:8080"
    depends_on:
      - evolution-mongodb
    environment:
      - SERVER_PORT=8080
      - SERVER_URL=http://localhost:8080
      # Autenticação
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY:-1d0a8328a3cab91dea8f1276cbb95172}
      - AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES=true
      # MongoDB
      - DATABASE_ENABLED=true
      - DATABASE_CONNECTION_URI=mongodb://evolution:evolution123@evolution-mongodb:27017/evolution?authSource=admin
      - DATABASE_CONNECTION_CLIENT_NAME=evolution
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_NEW_MESSAGE=true
      - DATABASE_SAVE_MESSAGE_UPDATE=true
      - DATABASE_SAVE_DATA_CONTACTS=true
      - DATABASE_SAVE_DATA_CHATS=true
      # Webhook global
      - WEBHOOK_GLOBAL_URL=${API_WEBHOOK_URL:-https://marina.nghair.com.br/webhook/whatsapp}
      - WEBHOOK_GLOBAL_ENABLED=true
      - WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS=false
      - WEBHOOK_EVENTS_MESSAGES_UPSERT=true
      - WEBHOOK_EVENTS_CONNECTION_UPDATE=true
      # QR Code
      - QRCODE_LIMIT=30
      - QRCODE_COLOR=#25D366
    volumes:
      - evolution-instances:/evolution/instances
    networks:
      - marina-network
    restart: unless-stopped

volumes:
  evolution-mongodb-data:
  evolution-instances:

networks:
  marina-network:
    driver: bridge
