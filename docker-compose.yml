services:
  evolution-api:
    image: atendai/evolution-api:v1.8.2
    container_name: evolution-api
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - SERVER_URL=http://localhost:8080
      - CORS_ORIGIN=*
      - CORS_METHODS=POST,GET,PUT,DELETE
      - CORS_CREDENTIALS=true
      # Autenticação
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY:-1d0a8328a3cab91dea8f1276cbb95172}
      # Armazenamento em arquivo (sem banco de dados externo)
      - DATABASE_ENABLED=false
      # Webhook global
      - WEBHOOK_GLOBAL_URL=http://172.16.1.1:8000/webhook/whatsapp
      - WEBHOOK_GLOBAL_ENABLED=true
      - WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS=false
      - WEBHOOK_EVENTS_MESSAGES_UPSERT=true
      - WEBHOOK_EVENTS_CONNECTION_UPDATE=true
      - WEBHOOK_EVENTS_SEND_MESSAGE=false
      - WEBHOOK_EVENTS_PRESENCE_UPDATE=false
      - WEBHOOK_EVENTS_CONTACTS_UPDATE=false
      - WEBHOOK_EVENTS_CHATS_UPDATE=false
      # QR Code
      - QRCODE_LIMIT=30
      - QRCODE_COLOR=#25D366
    volumes:
      - evolution-instances:/evolution/instances
    networks:
      - marina-network
    restart: unless-stopped

volumes:
  evolution-instances:

networks:
  marina-network:
    driver: bridge
